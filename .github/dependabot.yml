version: 2
updates:
  - package-ecosystem: github-actions
    directory: /
    schedule:
      interval: weekly
      day: monday
      time: "06:00"
      timezone: Etc/UTC
    target-branch: dev
    open-pull-requests-limit: 5
    rebase-strategy: auto
    cooldown:
      default-days: 7
    labels:
      - dependencies
      - actions
