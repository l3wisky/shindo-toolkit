name: Release

on:
  workflow_dispatch:

permissions: {}

concurrency:
  group: release
  cancel-in-progress: false

jobs:
  release:
    name: Build and publish
    if: github.ref == 'refs/heads/main'
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    permissions:
      contents: write
    steps:
      - name: Check out repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Install pinned toolchain
        uses: paradoxum-games/setup-rokit@29e6ee09651a3711e3a287a1037671d7b74db6d0 # v3
        with:
          version: 1.2.0
          cache: true

      - name: Install pinned Luau CLI
        run: scripts/install-luau-cli.sh

      - name: Validate, test, and build
        run: scripts/ci.sh

      - name: Read release version
        id: metadata
        shell: bash
        run: |
          .tools/luau-0.733/luau scripts/metadata.luau > "${RUNNER_TEMP}/shindo-metadata"
          IFS=$'\t' read -r version _ < "${RUNNER_TEMP}/shindo-metadata"
          if [[ -z "$version" ]]; then
              printf 'Release version is empty.\n' >&2
              exit 1
          fi
          printf 'version=%s\n' "$version" >> "$GITHUB_OUTPUT"
          printf 'tag=v%s\n' "$version" >> "$GITHUB_OUTPUT"

      - name: Publish release
        env:
          GH_TOKEN: ${{ github.token }}
          RELEASE_TAG: ${{ steps.metadata.outputs.tag }}
          RELEASE_VERSION: ${{ steps.metadata.outputs.version }}
        run: |
          if gh release view "$RELEASE_TAG" --repo "$GITHUB_REPOSITORY" > /dev/null 2>&1; then
              printf 'Release %s already exists. Bump src/config.luau before publishing.\n' "$RELEASE_TAG" >&2
              exit 1
          fi
          gh release create "$RELEASE_TAG" \
              dist/shindo-toolkit.luau \
              --generate-notes \
              --latest \
              --repo "$GITHUB_REPOSITORY" \
              --target "$GITHUB_SHA" \
              --title "Shindo Toolkit ${RELEASE_VERSION}"
