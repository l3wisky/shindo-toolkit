name: CI

on:
  pull_request:
    branches: [dev, main]
  push:
    branches: [dev, main]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.workflow }}-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

jobs:
  quality:
    name: Quality gate
    runs-on: ubuntu-24.04
    timeout-minutes: 12
    steps:
      - name: Check out repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Install pinned toolchain
        uses: paradoxum-games/setup-rokit@29e6ee09651a3711e3a287a1037671d7b74db6d0 # v3
        with:
          version: 1.2.0
          cache: true

      - name: Install pinned Luau CLI
        run: scripts/install-luau-cli.sh

      - name: Install pinned ShellCheck
        run: bash scripts/install-shellcheck.sh

      - name: Validate, test, and build
        run: scripts/ci.sh

      - name: Validate workflows
        env:
          ACTIONLINT_SHA256: 8aca8db96f1b94770f1b0d72b6dddcb1ebb8123cb3712530b08cc387b349a3d8
          ACTIONLINT_URL: https://github.com/rhysd/actionlint/releases/download/v1.7.12/actionlint_1.7.12_linux_amd64.tar.gz
        run: |
          archive="${RUNNER_TEMP}/actionlint.tar.gz"
          install_dir="${RUNNER_TEMP}/actionlint"
          mkdir -p "$install_dir"
          curl \
              --connect-timeout 15 \
              --fail \
              --location \
              --max-time 120 \
              --retry 3 \
              --retry-all-errors \
              --silent \
              --show-error \
              "$ACTIONLINT_URL" \
              --output "$archive"
          printf '%s  %s\n' "$ACTIONLINT_SHA256" "$archive" | sha256sum --check --strict
          tar --no-same-owner -xzf "$archive" -C "$install_dir" actionlint
          "$install_dir/actionlint"
