name: Bootstrap Rayfield vendor

on:
  push:
    branches: [refactor/vendor-rayfield]
    paths:
      - .github/workflows/bootstrap-rayfield-vendor.yml

permissions:
  contents: write

jobs:
  vendor:
    name: Download verified runtime
    runs-on: ubuntu-24.04
    timeout-minutes: 8
    steps:
      - name: Check out vendor branch
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: refactor/vendor-rayfield
          persist-credentials: true

      - name: Install pinned Luau CLI
        run: scripts/install-luau-cli.sh

      - name: Download and verify Rayfield
        run: bash scripts/vendor-rayfield.sh

      - name: Commit vendor snapshot
        run: |
          if [[ -z "$(git status --porcelain -- vendor/rayfield-gen2/bundled.luau)" ]]; then
              printf 'Rayfield vendor snapshot is already current.\n'
              exit 0
          fi
          git config user.name github-actions[bot]
          git config user.email 41898282+github-actions[bot]@users.noreply.github.com
          git add vendor/rayfield-gen2/bundled.luau
          git commit -m "vendor: pin Rayfield Gen2 1.1.0"
          git push origin HEAD:refactor/vendor-rayfield
