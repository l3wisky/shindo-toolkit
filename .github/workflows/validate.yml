name: Validate

on:
  pull_request:
    branches: [dev, main]
  push:
    branches: [dev, main]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: validate-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  validate:
    name: validate
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      # actions/checkout v4.2.2
      - name: Check out repository
        uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683
        with:
          fetch-depth: 0

      # Luau 0.732 official Ubuntu CLI archive
      - name: Install Luau CLI
        shell: bash
        run: |
          set -euo pipefail
          url="https://github.com/luau-lang/luau/releases/download/0.732/luau-ubuntu.zip"
          curl --fail --location --silent --show-error "$url" --output /tmp/luau-ubuntu.zip
          echo "05d0e67bedbe012cbb1faf8be4cc93099fa0968a621ee0c1f27ad9088d999555  /tmp/luau-ubuntu.zip" | sha256sum --check --strict
          unzip -q /tmp/luau-ubuntu.zip -d /tmp/luau
          sudo install -m 0755 /tmp/luau/luau /usr/local/bin/luau
          sudo install -m 0755 /tmp/luau/luau-compile /usr/local/bin/luau-compile

      - name: Run project checks
        run: luau check.luau

      - name: Compile tracked Luau files
        shell: bash
        run: |
          set -euo pipefail
          while IFS= read -r file; do
            echo "Compiling $file"
            luau-compile "$file" > /dev/null
          done < <(git ls-files '*.luau')

      - name: Verify loader references and README commands
        shell: bash
        run: |
          set -euo pipefail
          grep -Fq 'local runtimeRef = "v1.0.0"' loader.luau
          grep -Fq 'local runtimeRef = "dev"' loader.dev.luau
          grep -Fq 'loadstring(game:HttpGet("https://raw.githubusercontent.com/l3wisky/shindo-toolkit/main/loader.luau"))()' README.md
          grep -Fq 'loadstring(game:HttpGet("https://raw.githubusercontent.com/l3wisky/shindo-toolkit/dev/loader.dev.luau"))()' README.md

      - name: Check changed lines for whitespace errors
        shell: bash
        env:
          EVENT_NAME: ${{ github.event_name }}
          BEFORE_SHA: ${{ github.event.before }}
          BASE_SHA: ${{ github.event.pull_request.base.sha }}
        run: |
          set -euo pipefail
          if [[ "$EVENT_NAME" == "pull_request" ]]; then
            git diff --check "$BASE_SHA" "$GITHUB_SHA"
          elif [[ "$EVENT_NAME" == "push" && ! "$BEFORE_SHA" =~ ^0+$ ]]; then
            git diff --check "$BEFORE_SHA" "$GITHUB_SHA"
          else
            git diff --check HEAD
          fi
